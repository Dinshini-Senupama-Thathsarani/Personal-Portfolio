<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Section | Tower of Dinshini</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@300&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ─── RAPUNZEL THEMED SECTION ─── */
        .magical-box {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 480px;
            border-radius: 40px; /* Thawa round kala lassanata */
            overflow: hidden;
            /* Border ekata Gold tint ekak damma */
            border: 2px solid rgba(255, 215, 115, 0.3);
            /* Purple glow effect ekak box eka wata damma */
            box-shadow: 0 0 60px rgba(120, 80, 160, 0.25);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            filter: brightness(0.95) contrast(1.1);
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .talk-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            color: #ffd773; /* Magical Gold hair color[cite: 1] */
            font-style: italic;
            /* Gold glow effect for text */
            text-shadow: 0 0 25px rgba(255, 215, 115, 0.5);
            letter-spacing: 1px;
        }

        .underline {
            display: inline-block;
            border-bottom: 4px solid #ffd773;
            padding-bottom: 2px;
            margin-bottom: 8px;
            border-radius: 2px;
        }

        /* Subtle Purple gradient overlay */
        .magical-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(40, 20, 60, 0.2), transparent);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="magical-box">
    <canvas id="mainCanvas"></canvas>
    <div class="text-overlay">
        <h1 class="talk-heading">
            <span class="underline">Let's Talk</span><br>

    </div>
</div>

<script type="module">
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = 'https://images.unsplash.com/photo-1700583173020-624f5f11188c?w=1200';

    let originalData = null;
    let mouse = { x: 0.5, y: 0.5 };

    // Scale eka thawa podi kala face eka penna[cite: 1]
    let targetScale = 1.8, currentScale = 1.8;

    const PALETTE = {
        highlight: { r:255, g:215, b:115 }, // Rapunzel's Gold Hair[cite: 1]
        mid:       { r:110, g:70,  b:150 }, // Rapunzel's Purple Dress[cite: 1]
        dark:      { r:18,  g:12,  b:30  }  // Magical Dark Night[cite: 1]
    };

    function init() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const aspect = img.width / img.height;
        let w = canvas.width, h = canvas.width / aspect;
        if (h < canvas.height) { h = canvas.height; w = canvas.height * aspect; }
        ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
        originalData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) / rect.width;
        mouse.y = (e.clientY - rect.top) / rect.height;
        // Animation effect eka tune kala
        targetScale = 1.2 + (mouse.x * 2.5);
    });

    function draw() {
        if (!originalData) return;
        const output = ctx.createImageData(canvas.width, canvas.height);
        const src = originalData.data;
        const dst = output.data;

        currentScale += (targetScale - currentScale) * 0.05;
        // Face eka clear wenna brightness logic eka update kala
        const bright = 135 + (mouse.y * 75);

        for (let i = 0; i < src.length; i += 4) {
            let g = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
            let norm = (g + bright - 160) / 255;

            const x = (i/4) % canvas.width;
            const y = (i/4) / canvas.width;

            // Magical halftone dots pattern
            let pattern = Math.sin(x/currentScale) * Math.cos(y/currentScale);
            let thresh = (pattern + 1.3) / 2.5;

            let c = norm > thresh ? PALETTE.highlight : (norm > thresh*0.45 ? PALETTE.mid : PALETTE.dark);

            dst[i]=c.r; dst[i+1]=c.g; dst[i+2]=c.b; dst[i+3]=255;
        }
        ctx.putImageData(output, 0, 0);
        requestAnimationFrame(draw);
    }

    img.onload = () => { init(); draw(); };
    window.onresize = init;
</script>
