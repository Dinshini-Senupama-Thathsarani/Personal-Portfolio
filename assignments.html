<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Dinshini - Assignments</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #4a148c;
            --page-bg: #fdfbff;
        }

        body {
            background-color: var(--page-bg);
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .assignments-container {
            width: 100%;
            padding: 80px 0;
        }

        .section-header {
            width: 90%;
            margin-left: 5%;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #2d3436;
            margin: 0;
        }

        .rectangle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 0;
            background-color: var(--page-bg);
        }

        .exercise-item {
            position: relative;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.05; /* ලාවට පෙනීම */
            transition: opacity 0.6s ease-in-out, transform 0.4s ease;
            cursor: pointer;

            /* Desktop Background - Landscape Image */
            background-image: url('assets/lib/images/image_dea5e1.jpg');
            background-size: 500% 200%;
            background-repeat: no-repeat;
            image-rendering: -webkit-optimize-contrast;
        }

        .exercise-item:hover {
            opacity: 1;
            z-index: 10;
        }

        .content-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .ex-label {
            font-weight: 600;
            font-size: 1.2rem;
            color: #000;
            background: rgba(255,255,255,0.6);
            padding: 2px 10px;
            border-radius: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            border: 1.5px solid var(--text-main);
            background: white;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--text-main);
            color: white;
            box-shadow: 0 0 15px rgba(74, 20, 140, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center; justify-content: center;
        }

        .modal-content {
            width: 500px;
            max-width: 90%;
            border: 4px solid white;
            border-radius: 10px;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive Logic */
        @media (max-width: 1024px) {
            .rectangle-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .exercise-item {
                height: 250px;
                /* Mobile Background - Portrait Image */
                background-image: url('assets/lib/images/image_dcccfc.jpg');
                background-size: 200% 500%;
                opacity: 0.15; /* Mobile එකේදී පොඩ්ඩක් වැඩියෙන් පෙනීම හොඳයි */
            }

            .section-header h2 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<section class="assignments-container">
    <div class="section-header">
        <h2>Assignments</h2>
    </div>

    <div class="rectangle-grid" id="mainGrid"></div>
</section>

<div id="imageModal" class="modal" onclick="closeModal()">
    <img class="modal-content" id="img01">
</div>

<script>
    const assignmentData = [
        { img: 'assets/lib/images/img_1.png', git: 'https://github.com/Dinshini/ex1' },
        { img: 'assets/lib/images/img_2.png', git: 'https://github.com/Dinshini/ex2' },
        { img: 'assets/lib/images/img_3.png', git: 'https://github.com/Dinshini/ex3' },
        { img: 'assets/lib/images/img_4.png', git: 'https://github.com/Dinshini/ex4' },
        { img: 'assets/lib/images/img_5.png', git: 'https://github.com/Dinshini/ex5' },
        { img: 'assets/lib/images/img_1.png', git: 'https://github.com/Dinshini/ex6' },
        { img: 'assets/lib/images/img_2.png', git: 'https://github.com/Dinshini/ex7' },
        { img: 'assets/lib/images/img_3.png', git: 'https://github.com/Dinshini/ex8' },
        { img: 'assets/lib/images/img_4.png', git: 'https://github.com/Dinshini/ex9' },
        { img: 'assets/lib/images/img_5.png', git: 'https://github.com/Dinshini/ex10' }
    ];

    const grid = document.getElementById('mainGrid');
    const items = [];

    function updateLayout() {
        const isMobile = window.innerWidth <= 1024;

        items.forEach((item, i) => {
            let xPos, yPos;
            if (isMobile) {
                // Mobile (2x5 grid) logic
                xPos = (i % 2) * 100;
                yPos = Math.floor(i / 2) * 25;
            } else {
                // Desktop (5x2 grid) logic
                xPos = (i % 5) * 25;
                yPos = Math.floor(i / 5) * 100;
            }
            item.style.backgroundPosition = `${xPos}% ${yPos}%`;
        });
    }

    for(let i=0; i<10; i++) {
        const item = document.createElement('div');
        item.className = 'exercise-item';
        const data = assignmentData[i];

        item.innerHTML = `
            <div class="content-box">
                <span class="ex-label">Exercise ${i + 1 < 10 ? '0'+(i+1) : i+1}</span>
                <div class="btn-group">
                    <button class="btn" onclick="openModal('${data.img}', event)">VIEW</button>
                    <a href="${data.git}" target="_blank" class="btn">CODE</a>
                </div>
            </div>
        `;

        grid.appendChild(item);
        items.push(item);

        // Floating Animation
        let angle = Math.random() * 360;
        function floatEffect() {
            const moveX = Math.sin(angle) * 7;
            const moveY = Math.cos(angle) * 7;
            item.style.transform = `translate(${moveX}px, ${moveY}px)`;
            angle += 0.015;
            requestAnimationFrame(floatEffect);
        }
        floatEffect();
    }

    updateLayout();
    window.addEventListener('resize', updateLayout);

    function openModal(imgSrc, event) {
        event.stopPropagation();
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('img01');
        modal.style.display = "flex";
        modalImg.src = imgSrc;
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = "none";
    }
</script>
</body>
</html>
