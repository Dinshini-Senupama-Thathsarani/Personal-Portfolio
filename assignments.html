<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Skills Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #4a148c;
            --page-bg: #fdfbff;
        }

        body {
            background-color: var(--page-bg);
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* ----------------------------------------------------------- */
        /* 1. Skills Section Base Styles (Common)                      */
        /* ----------------------------------------------------------- */
        .skills-section {
            width: 100%;
            padding: 80px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* For absolutely positioning elements inside */
            overflow: hidden;
            font-family: 'Poppins', sans-serif;/* Important to contain the images and avoid scrollbars */
        }

        .skills-header {
            width: 90%;
            max-width: 1400px;
            margin-bottom: 50px;
            text-align: left; /* Header on the left */
        }

        .skills-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #2d3436;
            margin: 0;
        }

        /* Container to center and control the size of the images */
        .skills-image-wrapper {
            width: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        /* Common image styles to avoid code repetition */
        .skills-section .skills-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* Hover effect on images */
        .skills-section .skills-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 45px rgba(0,0,0,0.15);
        }

        /* Magic wand (if global cursor is used) compatibility */
        #magicWand:hover + .skills-section .skills-img {
            transform: scale(1.02) rotate(1deg); /* Slight rotate with wand */
        }

        /* ----------------------------------------------------------- */
        /* 2. Desktop Specific Styles (min-width: 1025px)              */
        /* ----------------------------------------------------------- */
        @media (min-width: 1025px) {
            /* We show the desktop container and hide the phone container */
            #desktopSkillsContainer { display: block; }
            #phoneSkillsContainer { display: none; }

            /* Desktop max-width for the image wrapper */
            .skills-image-wrapper { max-width: 1100px; }

            /* The desktop image is the 16:9 landscape collage */
            #desktopSkillsContainer .desktop-img {
                background-image: url('assets/lib/images/image_22.png');
            }
        }

        /* ----------------------------------------------------------- */
        /* 3. Phone Specific Styles (max-width: 1024px)               */
        /* ----------------------------------------------------------- */
        @media (max-width: 1024px) {
            /* We show the phone container and hide the desktop container */
            #desktopSkillsContainer { display: none; }
            #phoneSkillsContainer { display: block; }

            /* Adjust header size for smaller screens */
            .skills-header h2 { font-size: 2.5rem; }

            /* Limit max-width of phone image wrapper so it doesn't get too big on tablets */
            .skills-image-wrapper { max-width: 500px; }

            /* The phone image is the portrait vintage collage */
            #phoneSkillsContainer .phone-img {
                background-image: url('assets/lib/images/image_21.png');
            }
        }

        /* Standard image element used within the containers */
        /* We need a placeholder background or an <img> for this method */
        .skills-section .background-image-method {
            display: block;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* Default for 16:9 aspect ratio */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
        }

        /* Specific padding-bottom for the portrait image (approx. 9:16) */
        @media (max-width: 1024px) {
            .skills-section .background-image-method.phone-img {
                padding-bottom: 177.77%; /* Approximately 16/9, adjust to your vertical image's ratio */
            }
        }

        /* ----------------------------------------------------------- */
        /* 4. Alternative Method using HTML Image Tags (Easier)         */
        /* ----------------------------------------------------------- */
        /* Use this if you want to use <img src=""> in the HTML below,
           and comment out the 'background-image-method' section above. */

        /*
        .alternative-method-wrapper {
            position: relative;
            width: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 1025px) {
            .alternative-method-wrapper { max-width: 1100px; }
            #phoneAltImg { display: none; }
            #desktopAltImg { display: block; }
        }

        @media (max-width: 1024px) {
            .alternative-method-wrapper { max-width: 500px; }
            #phoneAltImg { display: block; }
            #desktopAltImg { display: none; }
        }
        */

    </style>
</head>
<body>

<div id="magicWand"></div>

<section class="skills-section" id="skills">
    <div class="skills-header">
        <h2>My Magical Skills</h2>
    </div>

    <div class="skills-image-wrapper" id="desktopSkillsContainer">
        <div class="skills-img background-image-method desktop-img"></div>
    </div>

    <div class="skills-image-wrapper" id="phoneSkillsContainer">
        <div class="skills-img background-image-method phone-img"></div>
    </div>

</section>

</body>
</html>
