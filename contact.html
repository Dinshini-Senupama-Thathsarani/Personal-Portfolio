<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-gold: #ffd773;
            --secondary-gold: #ffb74d;
            --midnight-purple: #1e1336;
            --deep-dark: #050308;
            --glass-bg: rgba(255,255,255,0.03);
            --border-glow: rgba(255,215,115,0.15);
        }

        #contact-hero {
            background: var(--deep-dark);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;

        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;

            flex-direction: row-reverse;
        }


        .canvas-section {
            flex: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e1336 0%, #050308 100%);
            position: relative;
            border-left: 1px solid rgba(255,215,115,0.08);
        }

        canvas {
            height: 90vh;
            width: auto;
            max-width: 95%;
            filter: drop-shadow(0 0 70px rgba(255,204,51,0.15));
            border-radius: 12px;
        }


        .chat-section {
            flex: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #1a0f2e 0%, #0a0612 100%);
            padding: 30px 24px;
        }

        #chat-popup {
            width: 100%;
            max-width: 400px;
            height: 580px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* HEADER */
        .chat-header {
            background: rgba(75,42,102,0.5);
            padding: 18px 20px;
            display: flex; align-items: center; gap: 14px;
            border-bottom: 1px solid rgba(255,215,115,0.12);
            flex-shrink: 0;
        }

        .profile-pic {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-gold), var(--secondary-gold));

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 16px rgba(255,215,115,0.3);
            overflow: hidden; flex-shrink: 0;
        }
        .profile-pic img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }

        .header-info { flex: 1; }
        .header-info h3 {
            margin: 0; font-size: 13.5px; font-weight: 700;
            color: var(--primary-gold); letter-spacing: 0.8px; text-transform: uppercase;
        }
        .header-info p { margin: 3px 0 0; font-size: 11px; color: rgba(180,150,240,0.8); }

        .online-dot {
            width: 10px; height: 10px; background: #4ade80;
            border-radius: 50%; box-shadow: 0 0 8px #4ade80; flex-shrink: 0;
        }

        /* MESSAGES */
        #messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 11px;
            scrollbar-width: thin; scrollbar-color: rgba(255,215,115,0.2) transparent;
        }
        #messages::-webkit-scrollbar { width: 3px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,215,115,0.2); border-radius:2px; }

        .msg-wrap { display: flex; width: 100%; }
        .msg-user { justify-content: flex-end; }
        .msg-bot  { justify-content: flex-start; }

        .bubble {
            font-size: 13px; padding: 10px 15px; max-width: 86%;
            line-height: 1.55; color: #fff;
            border: 1px solid rgba(180,150,240,0.15);
        }
        .bot-bubble  { background: rgba(255,255,255,0.08); border-radius: 20px 20px 20px 4px; }
        .user-bubble { background: rgba(106,76,147,0.45); border-radius: 20px 20px 4px 20px; border-color: rgba(180,160,255,0.3); }

        /* QUICK BUTTONS */
        .quick-options {
            padding: 9px 13px; display: flex; gap: 7px; flex-wrap: wrap;
            border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
        }
        .quick-btn {
            background: rgba(180,150,240,0.1); border: 1px solid rgba(180,150,240,0.2);
            color: #b496f0; padding: 6px 13px; border-radius: 20px;
            font-size: 11.5px; font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer; transition: 0.25s ease;
        }
        .quick-btn:hover { background: rgba(180,150,240,0.25); color:#fff; border-color: var(--primary-gold); transform: translateY(-2px); }

        /* INPUT */
        .input-area {
            padding: 12px 14px; display: flex; gap: 10px; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.25); flex-shrink: 0;
        }
        #msg-input {
            flex: 1; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(180,150,240,0.2); border-radius: 25px;
            padding: 9px 16px; color: #fff; font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif; outline: none; transition: 0.3s;
        }
        #msg-input::placeholder { color: rgba(255,255,255,0.3); }
        #msg-input:focus { border-color: var(--primary-gold); background: rgba(255,255,255,0.09); }
        #send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #6a4c93, #4b2a66);
            border: 1px solid rgba(255,215,115,0.2); color: var(--primary-gold);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: 0.3s;
        }
        #send-btn:hover { transform: scale(1.12); box-shadow: 0 0 12px rgba(106,76,147,0.6); }

        /* TYPING */
        .typing-dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--primary-gold); animation:bounce 1s infinite; }
        .typing-dot:nth-child(2){animation-delay:0.2s;}
        .typing-dot:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; height: auto; } /* Mobile වලදී යටට යයි */
            .canvas-section { height: 50vh; border-left: none; border-bottom: 1px solid rgba(255,215,115,0.08); }
            canvas { height: 46vh; }
            .chat-section { padding: 24px 16px; }
            #chat-popup { height: 520px; }
        }

        /* වම් පැත්තෙ ඉඳන් එන animation එක */
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-100px); /* වමට පික්සල් 100ක් ගිහින් පටන් ගන්නේ */
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Chat Popup එකට animation එක apply කිරීම */
        #chat-popup {
            width: 100%;
            max-width: 400px;
            height: 580px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;

            /* මෙතන පරණ fadeIn වෙනුවට slideInLeft දාන්න */
            animation: slideInLeft 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body>



<section id="contact-hero">

    <div class="main-container">

        <section class="canvas-section">
            <canvas id="mainCanvas"></canvas>
        </section>

        <section class="chat-section">
            <div id="chat-popup">

                <div class="chat-header">
                    <div class="profile-pic" id="profile-pic">
                        <img src="assets/lib/images/professionalpic.jpeg" alt="Dinshini"
                             onerror="this.style.display='none'; document.getElementById('pic-fallback').style.display='flex';">
                        <span id="pic-fallback" style="display:none;">👩‍💻</span>
                    </div>
                    <div class="header-info">
                        <h3>Dinshini Senupama</h3>
                        <p>Digital Assistant · Ready to help ✨</p>
                    </div>
                    <div class="online-dot"></div>
                </div>

                <div id="messages">
                    <div class="msg-wrap msg-bot">
                        <div class="bubble bot-bubble">Welcome! Dinshini is busy coding magic ✨, but I can help you reach her. What's on your mind?</div>
                    </div>
                    <div class="msg-wrap msg-bot">
                        <div class="bubble bot-bubble">Looking to start a project or just want to say hi? I'm here to help! 🚀</div>
                    </div>
                </div>

                <div class="quick-options">
                    <button onclick="sendQuick('Just saying hello! 👋')" class="quick-btn">Say Hello 👋</button>
                    <button onclick="sendQuick('I have a project idea! 🚀')" class="quick-btn">Project Idea 🚀</button>
                    <button onclick="sendQuick('I\'d love to collaborate! ✨')" class="quick-btn">Collaborate ✨</button>
                </div>

                <div class="input-area">
                    <input id="msg-input" type="text" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendMsg()">
                    <button onclick="sendMsg()" id="send-btn">➤</button>
                </div>

            </div>
        </section>

    </div>

</section>

<script type="module">
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const IMAGE_SOURCE = 'https://images.unsplash.com/photo-1700583173020-624f5f11188c?w=1200';
    let originalImageData = null;
    let imgElement = new Image();
    let mouse = { x: 0.5, y: 0.5 };
    let targetScale = 2.5, currentScale = 2.5;

    const PALETTE = {
        highlight: { r:255, g:183, b:77 },
        mid:       { r:77,  g:182, b:172 },
        dark:      { r:20,  g:15,  b:35  }
    };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX / window.innerWidth;
        mouse.y = e.clientY / window.innerHeight;
        targetScale = 0.5 + (mouse.x * 6);
    });

    function process() {
        if (!originalImageData) return;
        currentScale += (targetScale - currentScale) * 0.08;
        const w = canvas.width, h = canvas.height;
        const output = ctx.createImageData(w, h);
        const src = originalImageData.data, dst = output.data;
        const brightnessMod = 110 + (mouse.y * 140);
        for (let i = 0; i < src.length; i += 4) {
            let gray = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
            let norm = Math.min(1, Math.max(0, (gray + brightnessMod - 160) / 255));
            const x = (i/4) % w, y = Math.floor((i/4) / w);
            let pattern = Math.sin(x/currentScale) * Math.cos(y/currentScale);
            let threshold = (pattern + 1) / 2;
            let c = PALETTE.dark;
            if (norm > threshold) c = PALETTE.highlight;
            else if (norm > threshold * 0.4) c = PALETTE.mid;
            dst[i]=c.r; dst[i+1]=c.g; dst[i+2]=c.b; dst[i+3]=255;
        }
        ctx.putImageData(output, 0, 0);
        requestAnimationFrame(process);
    }

    imgElement.crossOrigin = "Anonymous";
    imgElement.src = IMAGE_SOURCE;
    imgElement.onload = () => {
        const aspect = imgElement.width / imgElement.height;
        canvas.width = 800;
        canvas.height = 800 / aspect;
        ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
        originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        process();
    };
</script>

<script>
    const REPLIES = {
        hello: [
            "Hey there! 👋 So lovely to hear from you! Dinshini will be thrilled — drop your contact info and she'll reach back to you soon! ✨",
            "Hi hi! 😊 Dinshini's in coding mode right now but she'd love to connect. Leave a note and she'll get back to you!",
            "Hello! 🌟 Welcome to Dinshini's little corner of the internet. Feel free to share your email and she'll say hi back!"
        ],
        project: [
            "Ooh a project idea?! 🚀 You've come to the right place! Tell me more — Dinshini will read every word and get back to you ASAP.",
            "That's exciting! 💡 Dinshini loves building cool things. Give me the details and I'll make sure she sees this right away.",
            "Let's build something awesome! 🛠️ Share your idea and your contact info — Dinshini will get in touch to discuss!"
        ],
        collaborate: [
            "Collaboration is Dinshini's favourite thing! 🤝 Drop your details here and she'll set up a quick call with you.",
            "Yes please! ✨ Dinshini is always open to meaningful collabs. Leave your info and she'll be in touch very soon!",
            "Love that energy! 🚀 Let's make something great together. Share your contact and Dinshini will reach out!"
        ],
        default: [
            "Got it! 📝 I've noted this down for Dinshini. She'll get back to you soon — usually within 24 hours!",
            "Thanks for reaching out! ✉️ Dinshini will see this when she surfaces from her coding cave. Stay tuned!",
            "Message received! 🌟 I'll pass this along to Dinshini. Have a wonderful day! ✨"
        ]
    };

    function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function getReply(text){
        const t = text.toLowerCase();
        if(t.includes('hello')||t.includes('hi')||t.includes('hey')||t.includes('saying hello')) return pickRandom(REPLIES.hello);
        if(t.includes('project')||t.includes('build')||t.includes('idea')||t.includes('cool')) return pickRandom(REPLIES.project);
        if(t.includes('collaborat')||t.includes('work together')||t.includes('team')||t.includes('love to collab')) return pickRandom(REPLIES.collaborate);
        return pickRandom(REPLIES.default);
    }

    function addMsg(text, isUser){
        const msgs = document.getElementById('messages');
        const wrap = document.createElement('div');
        wrap.className = 'msg-wrap ' + (isUser ? 'msg-user' : 'msg-bot');
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + (isUser ? 'user-bubble' : 'bot-bubble');
        bubble.textContent = text;
        wrap.appendChild(bubble);
        msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping(){
        const msgs = document.getElementById('messages');
        const wrap = document.createElement('div');
        wrap.id = 'typing-indicator';
        wrap.className = 'msg-wrap msg-bot';
        wrap.innerHTML = '<div class="bubble bot-bubble" style="display:flex;gap:5px;align-items:center;padding:12px 16px;"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
        msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping(){ const t=document.getElementById('typing-indicator'); if(t) t.remove(); }

    function sendMsg(){
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        addMsg(text, true);
        showTyping();
        setTimeout(()=>{ removeTyping(); addMsg(getReply(text), false); }, 1000+Math.random()*700);
    }

    function sendQuick(text){
        addMsg(text, true);
        showTyping();
        setTimeout(()=>{ removeTyping(); addMsg(getReply(text), false); }, 1000+Math.random()*600);
    }
</script>
</body>
</html>
