<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Creative Journey</title>

    <style>
        /* --- Internal CSS --- */
        .story-wrapper {
            width: 100%;
            min-height: 100vh;
            background-color: #C58FD2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 5%;
            overflow-x: hidden;
        }

        .story-main {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .story-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            color: #1a1014;
            margin-bottom: 50px;
            text-align: left;
        }

        .gallery-grid {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .gallery-item {
            position: relative;
            flex: 1;
            min-width: 80px;
            height: 450px;
            background-color: #FFB7FF;
            border: 3px solid #000;
            border-radius: 20px;
            cursor: pointer;
            transition: all 500ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 6px 6px 0px #000;
        }

        .item-visual {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .item-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #D592E5;
            z-index: 5;
            transition: all 0.4s ease;
        }

        .item-info span {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #000;
        }

        /* Desktop Hover Logic */
        @media (min-width: 769px) {
            .gallery-item:hover { flex: 3; transform: translateY(-10px); }
            .gallery-item:hover .item-visual { opacity: 1; }
            .gallery-item:hover .item-info {
                height: 80px;
                margin-top: auto;
                background: #EAC8F2;
                border-top: 3px solid #000;
            }
            .gallery-item:hover .item-info span {
                writing-mode: horizontal-tb;
                transform: rotate(0deg);
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .story-title { text-align: center; white-space: normal; }
            .gallery-grid { flex-direction: column; align-items: center; }

            .gallery-item {
                width: 100%;
                max-width: 420px;
                height: 68px; /* Collapsed */
                flex: none;
                transition: height 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            .item-info { pointer-events: none; }
            .item-info span { writing-mode: horizontal-tb; transform: rotate(0deg); }

            /* Clicked state via JS */
            .gallery-item.active-item {
                height: 300px;
            }

            .gallery-item.active-item .item-visual { opacity: 1; }
            .gallery-item.active-item .item-info {
                height: 58px;
                margin-top: auto;
                background: #EAC8F2;
                border-top: 3px solid #000;
            }
        }
    </style>
</head>
<body>

<section class="story-wrapper">
    <div class="story-main">
        <div>
            <h2 class="story-title">And when I'm not coding...🌈</h2>
        </div>

        <div class="gallery-container">
            <div class="gallery-grid">
                <!-- Card 1 -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/beach.jpeg" alt="Exploring the Uncharted" />
                    </div>
                    <div class="item-info"><span>Exploring the Uncharted</span></div>
                </div>

                <!-- Card 2 -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/soul.jpeg" alt="Pieces of My Soul" />
                    </div>
                    <div class="item-info"><span>Pieces of My Soul</span></div>
                </div>

                <!-- Card 3 -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/enhanced_image.jpg" alt="Expressions Unspoken" />
                    </div>
                    <div class="item-info"><span>Expressions Unspoken</span></div>
                </div>

                <!-- Card 4 (Updated Image) -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/image_bed8a7.jpg" alt="The Art of Discipline" />
                    </div>
                    <div class="item-info"><span>The Art of Discipline</span></div>
                </div>

                <!-- Card 5 -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/ahasa.jpeg" alt="What Keeps Me Inspired" />
                    </div>
                    <div class="item-info"><span>What Keeps Me Inspired</span></div>
                </div>

                <!-- Card 6 -->
                <div class="gallery-item" onclick="handleGalleryClick(this)">
                    <div class="item-visual">
                        <img src="assets/lib/images/me.jpeg" alt="Beyond the Screen" />
                    </div>
                    <div class="item-info"><span>Beyond the Screen</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleGalleryClick(item) {
            if (window.innerWidth <= 768) {
                const alreadyOpen = item.classList.contains('active-item');

                // Close others
                document.querySelectorAll('.gallery-item').forEach(el => {
                    el.classList.remove('active-item');
                });

                // Toggle
                if (!alreadyOpen) {
                    item.classList.add('active-item');
                }
            }
        }
    </script>
</section>

</body>
</html>
