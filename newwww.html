<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editorial Section</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            background:#0f0b14;
            overflow-x:hidden;
        }

        /* SECTION */

        .editorial-section{
            width:100%;
            height:100vh;

            padding:
                    110px 25px 25px 25px;

            background:
                    rgba(166, 139, 175, 0.97);
        }

        /* GRID */

        .editorial-grid{

            width:100%;
            height:100%;

            display:grid;

            grid-template-columns:
    1fr 1fr 1fr 1fr 1.2fr;

            grid-template-rows:
    1fr 1fr 1fr;

            border-top:1px solid rgba(255,255,255,.25);
            border-left:1px solid rgba(255,255,255,.25);

            backdrop-filter:blur(10px);
        }

        /* BOX */

        .box{

            position:relative;

            border-right:1px solid rgba(255,255,255,.25);
            border-bottom:1px solid rgba(255,255,255,.25);

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            transition:.4s ease;

            background:
                    rgba(255,255,255,.03);

        }

        .box:hover{
            background:
                    rgba(255,255,255,.08);
        }

        /* TEXT */

        .box h2{

            font-family:'Cormorant Garamond',serif;
            font-size:3rem;
            font-weight:600;

            color:#f7f2fa;

            transition:.4s;
        }

        .box:hover h2{
            transform:scale(1.06);
            letter-spacing:1px;
        }

        /* SMALL LABEL */

        .label{

            position:absolute;

            top:18px;
            left:18px;

            font-size:10px;
            letter-spacing:2px;

            text-transform:uppercase;

            color:#f1dfff;
        }

        /* IMAGE BOXES */

        .image-box{
            padding:22px;
        }

        /* INNER IMAGE CARD */

        .image-card{

            width:100%;
            height:100%;

            overflow:hidden;

            position:relative;

            background:#fff;

            box-shadow:
                    0 20px 40px rgba(0,0,0,.18);
        }

        /* IMAGES */

        .image-card img{

            position:absolute;

            width:100%;
            height:100%;

            object-fit:cover;

            opacity:0;

            transition:1s ease;
        }

        .image-card img.active{
            opacity:1;
        }

        /* LEFT IMAGE */

        .left-image{
            grid-column:1 / 3;
            grid-row:2 / 4;
        }

        /* RIGHT IMAGE */

        .right-image{
            grid-column:5 / 6;
            grid-row:1 / 3;
        }

        /* GLOW */

        .box::before{

            content:'';

            position:absolute;
            inset:0;

            background:
                    linear-gradient(
                            135deg,
                            rgba(255,255,255,.08),
                            transparent
                    );

            opacity:0;

            transition:.5s;
        }

        .box:hover::before{
            opacity:1;
        }

        /* RESPONSIVE */

        @media(max-width:1100px){

            .editorial-section{
                height:auto;
            }

            .editorial-grid{

                grid-template-columns:1fr 1fr;
                grid-auto-rows:220px;
            }

            .left-image,
            .right-image{
                grid-column:auto;
                grid-row:auto;
            }

        }

        @media(max-width:700px){

            .editorial-grid{
                grid-template-columns:1fr;
            }

            .box h2{
                font-size:2rem;
            }

        }

    </style>
</head>

<body>

<section class="editorial-section">

    <div class="editorial-grid">

        <!-- TOP -->

        <div class="box">
            <span class="label">Frontend</span>
            <h2>HTML</h2>
        </div>

        <div class="box">
            <span class="label">Styling</span>
            <h2>CSS</h2>
        </div>

        <div class="box">
            <span class="label">Interactive</span>
            <h2>JavaScript</h2>
        </div>

        <div class="box">
            <span class="label">Framework</span>
            <h2>React</h2>
        </div>

        <!-- RIGHT IMAGE -->

        <div class="box image-box right-image">

            <div class="image-card">

                <img class="active"
                     src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=1200&auto=format&fit=crop">

                <img
                        src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?q=80&w=1200&auto=format&fit=crop">

                <img
                        src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1200&auto=format&fit=crop">

            </div>

        </div>

        <!-- LEFT IMAGE -->

        <div class="box image-box left-image">

            <div class="image-card">

                <img class="active"
                     src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1200&auto=format&fit=crop">

                <img
                        src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1200&auto=format&fit=crop">

                <img
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop">

            </div>

        </div>

        <!-- BOTTOM -->

        <div class="box">
            <span class="label">Backend</span>
            <h2>Java</h2>
        </div>

        <div class="box">
            <span class="label">Database</span>
            <h2>MySQL</h2>
        </div>

        <div class="box">
            <span class="label">Design</span>
            <h2>UI/UX</h2>
        </div>

        <div class="box">
            <span class="label">Creative</span>
            <h2>API</h2>
        </div>

        <div class="box">
            <span class="label">Theme</span>
            <h2>Rapunzel</h2>
        </div>

        <div class="box">
            <span class="label">Aesthetic</span>
            <h2>Dreamy</h2>
        </div>

    </div>

</section>

<script>

    /* RIGHT IMAGE SLIDER */

    const rightImages =
        document.querySelectorAll('.right-image img');

    let rightIndex = 0;

    setInterval(() => {

        rightImages[rightIndex]
            .classList.remove('active');

        rightIndex =
            (rightIndex + 1) % rightImages.length;

        rightImages[rightIndex]
            .classList.add('active');

    }, 1700);

    /* LEFT IMAGE SLIDER */

    const leftImages =
        document.querySelectorAll('.left-image img');

    let leftIndex = 0;

    setInterval(() => {

        leftImages[leftIndex]
            .classList.remove('active');

        leftIndex =
            (leftIndex + 1) % leftImages.length;

        leftImages[leftIndex]
            .classList.add('active');

    }, 2000);

</script>

</body>
</html>
